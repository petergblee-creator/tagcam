<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>태그 카메라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one narrow column. Home = live camera; edit = photo with date/text, size sliders, name, save. Crop is a separate panel. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1b1f1d; --muted:#5f6a64; --line:#d9ddd9;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#dcefe9; --warn:#a2451c; --strip:#1b1f1d; --strip-fg:#f1f4ef;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201e; --fg:#e7ece9; --muted:#9aa6a0; --line:#2f3733;
  --accent:#4fc2ab; --accent-fg:#06221c; --accent-soft:#16332d; --warn:#f0946a; --strip:#e7ece9; --strip-fg:#121614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201e; --fg:#e7ece9; --muted:#9aa6a0; --line:#2f3733;
  --accent:#4fc2ab; --accent-fg:#06221c; --accent-soft:#16332d; --warn:#f0946a; --strip:#e7ece9; --strip-fg:#121614; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding:env(safe-area-inset-top,0px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
section{display:flex;flex-direction:column;gap:12px}
h2{font-size:13px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted);margin:0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-align:center;padding:12px}
.big label.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.big label small{font-weight:400;font-size:12px;opacity:.8}
.big input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.big label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cam-ico{width:34px;height:34px}
.gear{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 10px;font-size:13px}
.settings{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
/* photo editor */
.photo{position:relative;border-radius:10px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.photo{display:flex;justify-content:center}
.photo canvas{display:block;max-width:100%;max-height:52vh;width:auto;height:auto}
.photo .tip{position:absolute;left:8px;top:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;pointer-events:none}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:auto}
.crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}
.crop::before,.crop::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid rgba(255,255,255,.35)}
.crop::before{left:33.33%;right:33.33%;border-left-width:1px;border-right-width:1px}
.crop::after{top:33.33%;bottom:33.33%;border-top-width:1px;border-bottom-width:1px}
.h{position:absolute;width:30px;height:30px;touch-action:none}
.h::after{content:"";position:absolute;width:14px;height:14px;border:3px solid #fff}
.h.nw{left:-8px;top:-8px}.h.nw::after{left:6px;top:6px;border-right:0;border-bottom:0}
.h.ne{right:-8px;top:-8px}.h.ne::after{right:6px;top:6px;border-left:0;border-bottom:0}
.h.sw{left:-8px;bottom:-8px}.h.sw::after{left:6px;bottom:6px;border-right:0;border-top:0}
.h.se{right:-8px;bottom:-8px}.h.se::after{right:6px;bottom:6px;border-left:0;border-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--fg);padding:8px 12px;font:500 13px var(--f-mono)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input[type=text]{font:15px var(--f-body);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
textarea{resize:none}
.fonts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fonts button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:4px 10px;font-size:17px;line-height:1.3}
.fonts button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.colors{display:flex;gap:8px}
.colors button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;flex:0 0 auto}
.colors button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.sizer{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.sizer span:first-child{min-width:56px;white-space:nowrap}
.sizer input{flex:0 1 200px;min-width:0;accent-color:var(--accent)}
.hdr{display:flex;gap:8px;align-items:center}
.fsbtn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:3px 9px;font-size:15px;line-height:1.3}
/* stamp sheet: phone = photo, memo, rest; wide (fold) = 3 columns */
.sthead{display:flex;align-items:center;gap:8px}
.sthead h2{flex:1}
.sthead .go{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:7px 18px;font-weight:700;font-size:14px}
.stgrid{display:flex;flex-direction:column;gap:12px}
.stgrid .photo{order:-1}
.stL,.stR{display:flex;flex-direction:column;gap:10px;min-width:0}
.stR .acts{display:none;gap:8px}
.stR .acts button{flex:1;white-space:nowrap;border-radius:10px;padding:11px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.stR .acts button.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);flex:2}
.colfont{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (min-width:640px){
  body.editing{padding-bottom:12px}
  body.editing .bar{display:none!important}
  body.editing .wrap{max-width:1280px;padding-block:10px;gap:10px}
  .stgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:14px}
  .stgrid .photo{order:0}
  .stgrid .photo canvas{max-height:min(78vh,720px);max-width:44vw}
  .stL,.stR{max-height:calc(100vh - 110px);overflow:auto}
  .stR .acts{display:flex}
}
.strip{background:var(--strip);color:var(--strip-fg);border-radius:8px;padding:12px 14px;font:700 15px/1.4 var(--f-mono);word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:8px}
#sEdit .chip{padding:4px 10px;font-size:13px}
#sEdit .fld{display:flex;flex-direction:column;gap:6px}
#sEdit .lbl{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
#sEdit .fname{font:500 12px var(--f-mono);color:var(--muted);word-break:break-all}
body.editing .bar{display:none!important}
.stR .acts{display:flex!important}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 13px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.ai{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chip.ai.on{color:var(--accent-fg)}
.chip .x{font-size:15px;line-height:1;opacity:.7}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.ai-state{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--accent);font-size:13px;padding:4px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.group{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:52vh;width:auto;max-width:100%;margin:0 auto;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.zoom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.45);padding:4px;border-radius:999px}
.zoom button{border:0;background:transparent;color:#fff;font:700 13px var(--f-body);min-width:40px;height:34px;border-radius:999px}
.zoom button.on{background:#fff;color:#000}
.shoot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid var(--accent);background:var(--surface);box-shadow:inset 0 0 0 4px var(--bg)}
.shutter:active{background:var(--accent)}
.side{min-width:92px}
.camerr{color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:14px}
.recent{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.recent div{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.recent b{font:500 13px var(--f-mono);word-break:break-all}
.recent span{font-size:12px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:12px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.bar .in{max-width:560px;width:100%;display:flex;gap:10px}
.bar button{flex:1;border-radius:10px;padding:13px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bar button.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);flex:2}
.bar button:disabled{opacity:.45}
.done{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;animation:fin .25s ease-out}
.done img{max-width:100%;max-height:72vh;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.done p{color:#fff;font:500 13px var(--f-mono);margin:0;text-align:center;word-break:break-all}
.done .dbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.done .tolog{border:0;border-radius:999px;padding:11px 20px;font:700 15px var(--f-body);background:#fff;color:#111}
.done .tolog.more{background:#1F57C9;color:#fff}
.done img{max-height:64vh}
.done .bar5{width:min(320px,80%);height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.done .bar5 i{display:block;height:100%;background:#fff;animation:shrink 2s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.done{animation:none}}
.fnopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.fnopts .chip{padding:3px 9px;font-size:12px}
#sList .lbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#sList .lbar .chip{padding:5px 11px;font-size:13px}
.lday{font-weight:700;font-size:14px;margin:14px 0 6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.lit{position:relative;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--surface);padding:0;text-align:left;color:var(--fg)}
.lit.on{border-color:var(--accent)}
.lit img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.lit .ck{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.lit.on .ck{background:var(--accent)}
.lit .sent{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.lit .cap{display:block;font-size:11px;line-height:1.3;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lacts{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.lacts button{flex:1;border-radius:10px;padding:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.lacts button.go{flex:2;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lacts button:disabled{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.sendbox{border:1px solid var(--accent);border-radius:10px;padding:12px;margin:10px 0;font-size:14px;line-height:1.5}
.sendbox a{display:inline-block;margin-top:8px;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:9px 16px;font-weight:700;text-decoration:none}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--fg);margin:0}
.msg.err{background:transparent;border:1px solid var(--warn);color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>태그 카메라</h1>
    <div class="hdr"><button class="fsbtn" id="fsBtn" type="button" aria-label="전체화면" title="전체화면">⛶</button><button class="gear" id="listBtn" type="button">찍은 사진</button><button class="gear" id="gear" type="button">설정</button></div>
  </header>

  <section class="settings" id="settings" hidden>
    <h2>사진 분석 (선택)</h2>
    <p class="hint">Anthropic API 키를 넣으면 사진 내용을 분석해 이름 선택지를 추천합니다. 키는 이 폰에만 저장됩니다. 비워 두면 분석 없이 씁니다.</p>
    <input type="text" id="apiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    <div class="row"><button class="btn" id="saveKey" type="button">저장</button><button class="btn" id="clearKey" type="button">키 삭제</button><span class="hint" id="keyState"></span></div>
    <h2>백업</h2>
    <p class="hint">폴더·태그·선택지 목록을 파일로 내보내거나 불러옵니다.</p>
    <div class="row"><button class="btn" id="exportLists" type="button">내보내기</button><label class="btn" for="importLists" style="position:relative;overflow:hidden">불러오기<input type="file" id="importLists" accept="application/json,.json" style="position:absolute;inset:0;opacity:0"></label></div>
  </section>

  <!-- home: live camera -->
  <section id="sHome">
    <div class="cam"><video id="video" playsinline muted autoplay></video><div class="zoom" id="zoom" hidden></div><div class="camerr" id="camErr" hidden></div></div>
    <div class="shoot">
      <label class="btn side" for="pick" style="position:relative;overflow:hidden;text-align:center">갤러리<input id="pick" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0"></label>
      <button class="shutter" id="shutter" type="button" aria-label="촬영"></button>
      <label class="btn side" for="cam" style="position:relative;overflow:hidden;text-align:center">기본 카메라<input id="cam" type="file" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0"></label>
    </div>
  </section>

  <!-- edit: stamp sheet (phone: photo → memo → rest / wide: 3 columns) -->
  <section id="sEdit" hidden>
    <div class="sthead"><h2>사진 위 표시</h2><button class="go" id="topSave" type="button">저장</button><button class="btn" id="topCancel" type="button">취소</button></div>
    <div class="stgrid">
      <div class="stL">
        <h2><label for="ovText">메모 (사진 위에 들어감)</label></h2>
        <input type="text" id="ovText" maxlength="40" placeholder="떠올릴 내용, 할 일, 고칠 점" enterkeyhint="done">
        <div class="chips" id="memos"></div>
        <div class="fld">
          <div class="sub"><span class="lbl">주제</span><button class="link" id="editTopics" type="button">편집</button></div>
          <div class="chips" id="topics"></div>
          <div class="addrow" id="topicAdd" hidden><input type="text" id="newTopic" placeholder="새 주제 (예: 독서)" maxlength="12"><button class="btn" id="addTopic" type="button">추가</button></div>
        </div>
        <div class="fld">
          <div class="sub"><span class="lbl">장소</span><button class="link" id="editPlaces" type="button">편집</button></div>
          <div class="chips" id="places"></div>
          <div class="addrow" id="placeAdd" hidden><input type="text" id="newPlace" placeholder="새 장소 (예: 거래처 사무실)" maxlength="20"><button class="btn" id="addPlace" type="button">추가</button></div>
        </div>
        <div class="fld">
          <div class="sub"><span class="lbl">파일 이름</span><button class="link" id="editLabels" type="button">편집</button></div>
          <div class="chips" id="labels"></div>
          <div class="addrow" id="labelAdd" hidden><input type="text" id="newLabel" placeholder="새 선택지" maxlength="30"><button class="btn" id="addLabel" type="button">추가</button></div>
        </div>
      </div>
      <div class="photo" id="photo"><canvas id="view"></canvas><span class="tip" id="tip">날짜·메모를 끌어서 이동</span></div>
      <div class="stR">
        <div class="ai-state" id="aiState"></div>
        <div class="sizer"><span>메모 크기</span><input type="range" id="ovSize" min="5" max="15" value="13"><span id="ovSizeVal">13</span></div>
        <div class="sizer"><span>날짜 크기</span><input type="range" id="stSize" min="5" max="15" value="10"><span id="stSizeVal">10</span></div>
        <div class="colfont"><div class="colors" id="colors"></div><div class="fonts" id="fonts"></div></div>
        <div class="row">
          <button class="btn" id="toCrop" type="button">자르기·회전</button>
          <label class="toggle" for="stampOn"><input type="checkbox" id="stampOn" checked> 날짜·장소 넣기</label>
        </div>
        <div class="fname" id="strip"></div>
        <div class="fnopts" id="fnOpts"></div>
        <div id="saveMsg"></div>
        <div class="acts"><button id="rawSave" type="button">표시 없이</button><button id="wideSave" class="go" type="button">저장</button></div>
      </div>
    </div>
  </section>

  <!-- list: photos taken with this app -->
  <section id="sList" hidden>
    <div class="sthead"><h2>찍은 사진</h2><button class="btn" id="listClose" type="button">카메라로</button></div>

<script>
(() => {
const $ = id => document.getElementById(id);

const LOG_URL = "https://claude.ai/artifact/RPCrfxU7tcwF7YjrMvUFNv";

  { f:"Black Han Sans", w:"400", n:"굵은 글씨" },

const BLUE = 4;
let lists = JSON.parse(JSON.stringify(DEFAULTS));
let screen = "home";
let src = null;          // working image (after optional crop/rotate)
let shotTime = new Date();
let sel = { label: "", folder: "", tags: new Set(), place: "" };
let ai = { labels: [], tags: [], pick: [], status: "", place: "", newPlaces: [], memos: [] };
const edit = { labels:false, folders:false, tags:false, places:false, topics:false };
let ov = { text:"", x:.5, y:.9, moved:false };
let st = { x:.5, y:.82 };
let color = BLUE;
const savedColor = () => (lists.style && COLORS[lists.style.color]) ? lists.style.color : BLUE;

/* ---------- persistence (this phone only) ---------- */
function lsLoad(){ try{ const v = JSON.parse(localStorage.getItem("tagcam")||"null"); if(v){ lists = Object.assign({}, DEFAULTS, v); lists.style = Object.assign({}, DEFAULTS.style, v.style||{}); if(lists.style.v !== 2){ lists.style.color = 1; lists.style.size = 13; lists.style.v = 2; } if(!Array.isArray(lists.places)) lists.places = DEFAULTS.places.slice(); if(!Array.isArray(lists.topics)) lists.topics = DEFAULTS.topics.slice(); lists.fn = Object.assign({}, DEFAULTS.fn, v.fn||{}); if(lists.style.cv !== 1){ lists.style.color = BLUE; lists.style.cv = 1; } if(!FONTS.some(F => F.f === lists.style.font)) lists.style.font = FONTS[0].f; } }catch(e){} }

lsLoad();
const getKey = () => { try{ return localStorage.getItem("tagcam_key")||""; }catch(e){ return ""; } };

if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }

/* ---------- time ---------- */
const pad = n => String(n).padStart(2,"0");
function round2h(d){
  const x = new Date(d.getTime());
  const h = x.getHours() + x.getMinutes()/60;
  let r = Math.round(h/2)*2;
  x.setMinutes(0,0,0);
  if(r === 24){ x.setDate(x.getDate()+1); r = 0; }
  x.setHours(r);
  return x;
}
const WD = ["일","월","화","수","목","금","토"];
function round20(d){ const x = new Date(d.getTime()); const m = Math.round((x.getMinutes()+x.getSeconds()/60)/20)*20; x.setSeconds(0,0); x.setMinutes(0); x.setTime(x.getTime()+m*60000); return x; }
function stampLines(d0){ const d = round20(d0); return [ (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+") "+pad(d.getHours())+":"+pad(d.getMinutes()) ]; }
const clean = s => String(s||"").trim().replace(/[\\/:*?"<>|\s]+/g,"-").replace(/^-+|-+$/g,"");
function fileName(){
  const r = round2h(shotTime);
  const label = clean(sel.label);
  const memo = clean(ov.text).slice(0, 24), place = clean(sel.place);
  const topic = clean(sel.topic);
  const F = lists.fn || DEFAULTS.fn;
  let n = r.getFullYear()+pad(r.getMonth()+1)+pad(r.getDate()) + "_" + pad(r.getHours())+"00" + (F.topic && topic ? "_" + topic : "") + (F.label && label ? "_" + label : "") + (F.place && place ? "_" + place : "") + (F.memo && memo ? "_" + memo : "");
  return n + ".jpg";
}

/* ---------- screens ---------- */

}
$("back").onclick = () => { if(screen === "crop") show("edit"); else show("home"); };
$("topCancel").onclick = () => show("home");
$("rawSave").onclick = () => save(true);
$("topSave").onclick = $("wideSave").onclick = () => save();
/* 전체화면 */
(() => { const b = $("fsBtn"), de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen, ex = document.exitFullscreen || document.webkitExitFullscreen;
  if(!req){ b.hidden = true; return; }
  b.onclick = async () => { try{ if(document.fullscreenElement || document.webkitFullscreenElement) await ex.call(document); else await req.call(de); }catch(e){} };
})();
$("next").onclick = () => { if(screen === "crop"){ applyCrop(); show("edit"); } else save(); };

/* ---------- live camera ---------- */
const video = $("video"); let stream = null, track = null;
async function startCam(){
  if(stream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ if(!navigator.mediaDevices) camErr("이 브라우저는 카메라 미리보기를 지원하지 않습니다. 아래 '기본 카메라'를 쓰세요."); return; }

    stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:4032}, height:{ideal:3024} } });
    track = stream.getVideoTracks()[0]; video.srcObject = stream; $("camErr").hidden = true; setupZoom();
    try{ await video.play(); }catch(e){}
  }catch(e){ stream = null; camErr("카메라를 열 수 없습니다. 크롬 주소창 왼쪽 아이콘 → 권한에서 카메라를 허용하거나, 아래 '기본 카메라'를 쓰세요."); }
}
let zoomVal = 1, hwZoom = false;
function setupZoom(){
  const Z = $("zoom"); Z.innerHTML = ""; zoomVal = 1; video.style.transform = "";
  let caps = {}; try{ caps = track.getCapabilities ? track.getCapabilities() : {}; }catch(e){}
  hwZoom = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
  let opts = hwZoom ? [caps.zoom.min, 1, 2, 3, 5].filter(v => v >= caps.zoom.min && v <= caps.zoom.max) : [1, 2, 3];
  opts = [...new Set(opts.map(v => Math.round(v*10)/10))];
  opts.forEach(v => { const b = document.createElement("button"); b.type = "button"; b.textContent = (v < 1 ? v.toFixed(1) : v) + "×"; b.className = v === 1 ? "on" : "";
    b.onclick = async () => { zoomVal = v; [...Z.children].forEach(x => x.classList.toggle("on", x === b));
      if(hwZoom){ try{ await track.applyConstraints({ advanced:[{ zoom: v }] }); }catch(e){} }
      else video.style.transform = v === 1 ? "" : "scale(" + v + ")"; };
    Z.appendChild(b); });
  Z.hidden = opts.length < 2;
}
function camErr(t){ $("camErr").textContent = t; $("camErr").hidden = false; }
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; track = null; video.srcObject = null; } }
document.addEventListener("visibilitychange", () => { if(document.hidden) stopCam(); else if(screen === "home") startCam(); });
$("shutter").onclick = async () => {
  if(!track){ startCam(); return; }
  shotTime = new Date();
  let blob = null;
  if(hwZoom && "ImageCapture" in window){ try{ blob = await new ImageCapture(track).takePhoto(); }catch(e){ blob = null; } }
  if(blob){ loadBlob(blob); return; }
  const vw = video.videoWidth, vh = video.videoHeight, z = hwZoom ? 1 : zoomVal;
  const sw = Math.round(vw/z), sh = Math.round(vh/z);
  const c = document.createElement("canvas"); c.width = sw; c.height = sh;
  c.getContext("2d").drawImage(video, (vw-sw)/2, (vh-sh)/2, sw, sh, 0, 0, sw, sh); startEdit(c);
};
function startEdit(canvas){
  src = canvas;
  const lp = lists.lastPlace && lists.places.includes(lists.lastPlace) ? lists.lastPlace : "";
  sel = { label:"", folder:"", tags: new Set(), place: lp, topic: "" }; ai = { labels:[], tags:[], pick:[], status:"", place:"", newPlaces:[], memos:[], topic:"" };
  ov = { text:"", x:.5, y:.9, moved:false }; st = { x:.5, y:.82, moved:false }; color = savedColor(); $("ovText").value = ""; renderStyle();
  stopCam(); show("edit"); analyze();
}
function loadBlob(b){
  const url = URL.createObjectURL(b); const img = new Image();
  img.onload = () => {
    const MAX = 4000; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, MAX/Math.max(w,h));
    const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); startEdit(c);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

/* ---------- load photo ---------- */
function onFile(e){
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if(!f) return;
  shotTime = f.lastModified ? new Date(f.lastModified) : new Date();
  loadBlob(f);
}
$("cam").onchange = onFile; $("pick").onchange = onFile;

/* ---------- overlay drawing ---------- */
const fontOf = () => FONTS.find(x => x.f === lists.style.font) || FONTS[0];
function fontSpec(px){ const F = fontOf(); return F.w + " " + px + "px \"" + F.f + "\", \"Noto Sans KR\", sans-serif"; }
async function ensureFont(){ try{ const F = fontOf(); await document.fonts.load(F.w + " 40px \"" + F.f + "\"", ov.text || "가A1"); await document.fonts.load("400 40px \"Jua\"", "10/8(목) 14:40"); }catch(e){} }
function drawOverlays(g, W, H){
  const base = Math.min(W, H);
  // date stamp block: date / time / place, cute font
  let blockBottom = st.y*H;
  if($("stampOn").checked){
    const px = Math.max(14, Math.round(base * (lists.style.stamp||10) / 100));
    g.font = "400 " + px + "px \"Jua\", \"Noto Sans KR\", sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.lineJoin = "round"; g.lineWidth = Math.max(3, px*0.16); g.strokeStyle = "rgba(0,0,0,.8)"; g.fillStyle = "#ffffff";
    const L = stampLines(shotTime); if(sel.place) L.push(sel.place);
    const lh = px*1.2;
    if(!st.moved){ // 날짜는 아래쪽(0.82), 메모가 밑에 들어갈 자리가 없으면 위로 올림
      st.y = .82; const t0 = ov.text.trim();
      if(t0 && !ov.moved){ const mpx = Math.round(base * lists.style.size / 100), mh = t0.split(/\n/).length * mpx * 1.15;
        const maxC = H - mpx*0.3 - mh - mpx*0.4 - (L.length-1)*lh/2 - px*0.6; st.y = Math.max(.1, Math.min(.82, maxC / H)); }
    }
    const y0 = st.y*H - (L.length-1)*lh/2;
    L.forEach((t,i) => { g.strokeText(t, st.x*W, y0 + i*lh); g.fillText(t, st.x*W, y0 + i*lh); });
    blockBottom = y0 + (L.length-1)*lh + px*0.6;
  }
  // memo: right under the stamp by default, draggable
  const t = ov.text.trim();
  if(t){
    const C = COLORS[color] || COLORS[BLUE];
    const px = Math.round(base * lists.style.size / 100);
    const lines = t.split(/\n/); const lh = px * 1.15;
    if(!ov.moved){ ov.x = st.x; ov.y = Math.min(1 - (lines.length*lh/2 + px*0.3)/H, (blockBottom + px*0.4 + (lines.length*lh)/2) / H); }
    g.font = fontSpec(px); g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
    const y0 = ov.y*H - (lines.length-1)*lh/2;
    g.lineWidth = Math.max(2, px*0.09); g.strokeStyle = C.stroke; g.fillStyle = C.fill;
    lines.forEach((ln,i) => { g.strokeText(ln, ov.x*W, y0 + i*lh); g.fillText(ln, ov.x*W, y0 + i*lh); });
  }
}
const view = $("view");
/* ---------- frame (액자): blurred tone of the photo itself ---------- */
const frameW = (W, H) => Math.max(24, Math.round(Math.min(W, H) * 0.20));
function drawFrameBg(g, img, W, H, b){
  const TW = W + 2*b, TH = H + 2*b;
  // blurred, slightly dimmed copy of the photo fills the whole frame
  const k = Math.max(TW / W, TH / H) * 1.08, dw = W*k, dh = H*k;
  g.save(); g.filter = "blur(" + Math.round(b*0.45) + "px) saturate(1.15) brightness(.82)";
  g.drawImage(img, (TW-dw)/2, (TH-dh)/2, dw, dh); g.restore();
  // soft bevel: lit top/left, shaded bottom/right
  const side = (pts, c) => { g.beginPath(); pts.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.closePath(); g.fillStyle = c; g.fill(); };
  side([[0,0],[TW,0],[TW-b,b],[b,b]], "rgba(255,255,255,.16)");
  side([[0,0],[b,b],[b,TH-b],[0,TH]], "rgba(255,255,255,.08)");
  side([[TW,0],[TW,TH],[TW-b,TH-b],[TW-b,b]], "rgba(0,0,0,.18)");
  side([[0,TH],[TW,TH],[TW-b,TH-b],[b,TH-b]], "rgba(0,0,0,.26)");
  g.lineWidth = Math.max(1, b*0.03); g.strokeStyle = "rgba(255,255,255,.35)"; g.strokeRect(g.lineWidth/2, g.lineWidth/2, TW-g.lineWidth, TH-g.lineWidth);
  // drop shadow under the photo
  g.save(); g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = b*0.35; g.shadowOffsetY = b*0.08; g.fillStyle = "#000"; g.fillRect(b, b, W, H); g.restore();
}
function drawFrameFg(g, W, H, b){
  // inner shadow on the photo edges + thin light lip
  const d = b*0.25;
  [[b, b, W, d, 0, b, 0, b+d], [b, b+H-d, W, d, 0, b+H, 0, b+H-d], [b, b, d, H, b, 0, b+d, 0], [b+W-d, b, d, H, b+W, 0, b+W-d, 0]].forEach(([x,y,w,h,x0,y0,x1,y1]) => {
    const gr = g.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,"rgba(0,0,0,.35)"); gr.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x,y,w,h);
  });
  const lip = Math.max(2, b*0.05); g.lineWidth = lip; g.strokeStyle = "rgba(255,255,255,.8)"; g.strokeRect(b - lip/2, b - lip/2, W + lip, H + lip);
}
function compose(g, img, W, H, b){
  drawFrameBg(g, img, W, H, b);
  g.drawImage(img, b, b, W, H);
  drawFrameFg(g, W, H, b);
  g.save(); g.translate(b, b); drawOverlays(g, W, H); g.restore();
}
let vb = 0;
async function drawView(){
  if(!src) return;
  await ensureFont();
  const W = Math.min(1200, src.width), k = W/src.width;
  const H = Math.round(src.height*k); vb = frameW(W, H);
  view.width = W + 2*vb; view.height = H + 2*vb;
  compose(view.getContext("2d"), src, W, H, vb);
  $("tip").hidden = !($("stampOn").checked || ov.text.trim());
}
let vdrag = null;
const relPos = e => { const r = view.getBoundingClientRect(), s = r.width / view.width, bx = vb*s; return { x: (e.clientX-r.left-bx)/(r.width-2*bx), y: (e.clientY-r.top-bx)/(r.height-2*bx) }; };
const clamp = v => Math.min(.98, Math.max(.02, v));
function moveItem(e){ const p = relPos(e); vdrag.o.x = clamp(p.x - vdrag.dx); vdrag.o.y = clamp(p.y - vdrag.dy); drawView(); }
view.addEventListener("pointerdown", e => {
  const p = relPos(e), items = [];
  if($("stampOn").checked) items.push(st);
  if(ov.text.trim()) items.push(ov);
  if(!items.length) return;
  const d = o => Math.hypot(o.x - p.x, o.y - p.y);
  const o = items.sort((a,b) => d(a) - d(b))[0];
  if(o === ov) ov.moved = true; else st.moved = true;
  vdrag = { o, dx: p.x - o.x, dy: p.y - o.y }; view.setPointerCapture(e.pointerId); e.preventDefault();
});
view.addEventListener("pointermove", e => { if(vdrag) moveItem(e); });
view.addEventListener("pointerup", () => vdrag = null); view.addEventListener("pointercancel", () => vdrag = null);
$("ovText").oninput = () => { ov.text = $("ovText").value; drawView(); render(); };
$("stampOn").onchange = drawView;
FONTS.forEach(F => { const b = document.createElement("button"); b.type = "button"; b.textContent = F.n; b.style.fontFamily = "\"" + F.f + "\", sans-serif"; b.style.fontWeight = F.w; b.dataset.f = F.f; b.onclick = () => { lists.style.font = F.f; persist(); renderStyle(); drawView(); }; $("fonts").appendChild(b); });
COLORS.forEach((C,i) => { const b = document.createElement("button"); b.type = "button"; b.style.background = C.fill; b.setAttribute("aria-label", C.n); b.onclick = () => { color = i; lists.style.color = i; persist(); renderStyle(); drawView(); }; $("colors").appendChild(b); });

const cv = $("cv"), stage = $("stage"), cropEl = $("crop");

stage.addEventListener("pointerdown", e => {

    if(drag.h.includes("n")) y1 = Math.min(Math.max(0,y1+dy), y2-MIN);

function ucs2(s){ const a=[]; for(const ch of s+"\0"){ const c=ch.charCodeAt(0); a.push(c&255, c>>8); } return a; }

    [0x9C9C, BYTE, xpC.length, xpC],

  const jpg = await new Promise(r => out.toBlob(r, "image/jpeg", 0.92));
  const name = fileName();
  const memoTxt = ov.text.trim();
  const meta = { date: shotTime, title: name.replace(/\.jpg$/,""), folder: sel.folder||"", tags:[...sel.tags], topic: sel.topic||"", place: sel.place||"", memo: memoTxt, label: sel.label||"" };
  lastBlob = new Blob([withMeta(new Uint8Array(await jpg.arrayBuffer()), meta)], {type:"image/jpeg"}); lastName = name;
  lists.recent = [{name, folder:sel.folder||"", tags:[...sel.tags], at: Date.now()}, ...(lists.recent||[])].slice(0,30);
  persist();
  try{
    const k = Math.min(1, 360/Math.max(out.width, out.height)), tc = document.createElement("canvas"); tc.width = Math.round(out.width*k); tc.height = Math.round(out.height*k);
    tc.getContext("2d").drawImage(out, 0, 0, tc.width, tc.height);
    const thumb = await new Promise(r => tc.toBlob(r, "image/jpeg", 0.7));
    await shotDB.put({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), name, at: shotTime.getTime(), topic: meta.topic, place: meta.place, memo: memoTxt, label: meta.label, sent: 0, blob: lastBlob, thumb });
    shotDB.prune(60);
  }catch(e){}
}
let doneTimer = null;
async function shareLast(){
  const file = new File([lastBlob], lastName, {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({ files:[file], title:lastName }); return "보냈습니다"; }catch(e){ return e && e.name === "AbortError" ? "" : "보내지 못했습니다"; } }
  return "이 브라우저는 보내기를 지원하지 않습니다";
}
function done(text){
  const box = document.createElement("div"); box.className = "done"; box.setAttribute("role","status");
  const img = document.createElement("img"); img.alt = "완성된 사진"; img.src = URL.createObjectURL(lastBlob);
  const p = document.createElement("p"); p.textContent = text;
  const bar = document.createElement("div"); bar.className = "bar5"; bar.appendChild(document.createElement("i"));
  const close = () => { clearTimeout(doneTimer); if(box.parentNode){ box.remove(); URL.revokeObjectURL(img.src); show("home"); } };
  const btns = document.createElement("div"); btns.className = "dbtns";
  const sh = document.createElement("button"); sh.type = "button"; sh.className = "tolog"; sh.textContent = "다른 앱으로 보내기";
  sh.onclick = async ev => { ev.stopPropagation(); clearTimeout(doneTimer); bar.remove(); const r = await shareLast(); if(r) sh.textContent = r; sh.onclick = e2 => { e2.stopPropagation(); close(); }; };
  const more = document.createElement("button"); more.type = "button"; more.className = "tolog more"; more.textContent = "📷 한 장 더";
  more.onclick = ev => { ev.stopPropagation(); close(); };
  btns.append(sh, more);
  box.append(img, p, btns, bar); document.body.appendChild(box);
  box.onclick = close; doneTimer = setTimeout(close, 2000);
}
async function save(raw){
  if(!src || $("next").disabled) return;
  $("next").disabled = true;
  await buildFile(raw);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new File([lastBlob], lastName, {type:"image/jpeg"})); a.download = lastName; a.rel = "noopener";
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 4000);
  done("저장했습니다: 다운로드 / " + lastName);
}

/* ---------- 찍은 사진 목록 (이 폰 IndexedDB) ---------- */
const shotDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("tagcam", 1); r.onupgradeneeded = () => r.result.createObjectStore("shots", { keyPath:"id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("shots", mode); const q = fn(t.objectStore("shots")); t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); }); };
  return {
    put: v => run("readwrite", s => s.put(v)),
    all: async () => ((await run("readonly", s => s.getAll())) || []).sort((a,b) => b.at - a.at),
    del: id => run("readwrite", s => s.delete(id)),
    prune: async n => { const a = await shotDB.all(); for(const x of a.slice(n)) await shotDB.del(x.id); },
  };
})();
function toast(t, ms){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2500); }
let shots = [], chosen = new Set(), thumbUrls = [];
async function openList(){
  try{ shots = await shotDB.all(); }catch(e){ shots = []; }
  const ids = new Set(shots.map(x => x.id)); chosen = new Set([...chosen].filter(id => ids.has(id)));
  if(!chosen.size){ const t = ymdOf(new Date()); shots.forEach(x => { if(!x.sent && ymdOf(new Date(x.at)) === t) chosen.add(x.id); }); }
  $("lsSend").innerHTML = ""; paintList();
}
const ymdOf = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
function paintList(){
  thumbUrls.forEach(u => URL.revokeObjectURL(u)); thumbUrls = [];
  const G = $("lsGrid"); G.innerHTML = "";
  if(!shots.length){ G.innerHTML = '<p class="hint">아직 이 앱으로 저장한 사진이 없습니다.</p>'; }
  const today = ymdOf(new Date()), days = [...new Set(shots.map(x => ymdOf(new Date(x.at))))];
  days.forEach(dk => {
    const g = shots.filter(x => ymdOf(new Date(x.at)) === dk), d0 = new Date(g[0].at);
    const h = document.createElement("div"); h.className = "lday"; h.textContent = (dk === today ? "오늘 · " : "") + (d0.getMonth()+1) + "/" + d0.getDate() + " (" + WD[d0.getDay()] + ") · " + g.length + "장"; G.appendChild(h);
    const box = document.createElement("div"); box.className = "lgrid";
    g.forEach(x => {
      const b = document.createElement("button"); b.type = "button"; b.className = "lit" + (chosen.has(x.id) ? " on" : "");
      const im = document.createElement("img"); im.alt = ""; const u = URL.createObjectURL(x.thumb || x.blob); thumbUrls.push(u); im.src = u;
      const ck = document.createElement("span"); ck.className = "ck"; ck.textContent = chosen.has(x.id) ? "✓" : "";
      const cap = document.createElement("span"); cap.className = "cap"; const t = new Date(x.at);
      cap.textContent = pad(t.getHours()) + ":" + pad(t.getMinutes()) + " " + [x.topic, x.memo || x.place].filter(Boolean).join(" · ");
      b.append(im, ck, cap);
      if(x.sent){ const s = document.createElement("span"); s.className = "sent"; s.textContent = "보냄"; b.appendChild(s); }
      b.onclick = () => { chosen.has(x.id) ? chosen.delete(x.id) : chosen.add(x.id); paintList(); };
      box.appendChild(b);
    });
    G.appendChild(box);
  });
  const n = chosen.size;
  $("lsGo").disabled = !n; $("lsDel").disabled = !n;
  $("lsGo").textContent = n ? "기록장으로 옮기기 (" + n + "장)" : "기록장으로 옮기기";
}
const pickBy = fn => { chosen = new Set(shots.filter(fn).map(x => x.id)); paintList(); };
$("lsToday").onclick = () => { const t = ymdOf(new Date()); pickBy(x => ymdOf(new Date(x.at)) === t); };
$("lsUnsent").onclick = () => pickBy(x => !x.sent);
$("lsAll").onclick = () => pickBy(() => true);
$("lsNone").onclick = () => pickBy(() => false);
$("listBtn").onclick = () => show("list");
$("listClose").onclick = () => show("home");
$("lsDel").onclick = async () => { if(!chosen.size) return; for(const id of chosen) await shotDB.del(id); toast(chosen.size + "장을 목록에서 뺐습니다 (폰에 저장된 파일은 그대로)"); chosen.clear(); openList(); };
const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
$("lsGo").onclick = async () => {
  const pick = shots.filter(x => chosen.has(x.id)).sort((a,b) => a.at - b.at); if(!pick.length) return;
  $("lsGo").disabled = true; $("lsGo").textContent = "묶는 중…";
  try{
    const items = []; for(const x of pick) items.push({ name: x.name, at: x.at, topic: x.topic, place: x.place, memo: x.memo, label: x.label, jpg: await b64(x.blob) });
    const now = new Date(), fn = "기록장으로_" + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes()) + "_" + items.length + "장.json";
    const blob = new Blob([JSON.stringify({ app: "tagcam", v: 1, made: now.getTime(), items })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fn; a.rel = "noopener"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 8000);
    for(const x of pick){ x.sent = Date.now(); await shotDB.put(x); }
    $("lsSend").innerHTML = '<div class="sendbox"><b>' + items.length + '장을 파일 1개로 받았습니다.</b><br>기록장 → <b>사진·영상</b> → 사진·영상 고르기에서 방금 받은 <b>' + fn.replace(/&/g,"&amp;").replace(/</g,"&lt;") + '</b> 하나만 고르면 주제·메모·장소가 그대로 들어갑니다.<br><a href="' + LOG_URL + '#tagcam" target="_blank" rel="noopener">기록장 열기</a></div>';
    chosen.clear(); paintList(); window.scrollTo(0,0);
  }catch(e){ toast("묶지 못했습니다: " + (e && e.message || e)); paintList(); }
};

/* ---------- 기록장 주제 맞추기: #topics=["운동",...] 로 열리면 주제 칩을 그대로 바꿈 ---------- */
(() => {
  const m = location.hash.match(/topics=([^&]*)/); if(!m) return;
  try{
    const t = JSON.parse(decodeURIComponent(m[1]));
    if(Array.isArray(t)){ const v = [...new Set(t.map(clean).filter(Boolean))].slice(0, 30); if(v.length){ lists.topics = v; persist(); setTimeout(() => toast("기록장 주제 " + v.length + "개로 맞췄습니다: " + v.join(" · "), 3500), 400); } }
  }catch(e){}
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
})();

show("home");
})();
</script>
